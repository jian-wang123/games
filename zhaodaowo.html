<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>找到我｜微恐文字解谜网页游戏</title>
<style>
  :root{
    --primary:#2563eb;
    --primary-soft:#e8f0fe;
    --bg:#f7f9fc;
    --card:#ffffff;
    --text:#1f2937;
    --text-sub:#6b7280;
    --line:#e5e9f0;
    --radius:14px;
    --warn:#dc2626;
    --warn-soft:#fef2f2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{
    scroll-behavior:smooth;
  }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
    padding:40px 16px;
  }
  .container{
    max-width:700px;
    margin:0 auto;
  }
  .back-bar{
    margin-bottom:20px;
  }
  .back-bar a{
    color:var(--primary);
  }
  .back-bar a:hover{
    text-decoration:underline;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px;
  }
  .title-main{
    font-size:28px;
    font-weight:800;
    text-align:center;
    margin-bottom:6px;
  }
  .sub-title{
    text-align:center;
    color:var(--text-sub);
    font-size:15px;
    margin-bottom:24px;
  }
  .warn-box{
    background:var(--warn-soft);
    border:1px solid #fecaca;
    border-radius:12px;
    padding:16px;
    margin-bottom:24px;
  }
  .warn-box h4{
    color:var(--warn);
    margin-bottom:8px;
    font-size:16px;
  }
  .warn-box p{
    font-size:14px;
    color:#4b5563;
  }
  .sec-h{
    font-size:18px;
    font-weight:700;
    margin-bottom:10px;
    margin-top:28px;
  }
  .story{
    font-size:15px;
    color:var(--text);
  }
  .tip-ready{
    margin-top:30px;
    text-align:center;
    font-size:16px;
  }
  .btn-start{
    display:block;
    width:100%;
    text-align:center;
    margin-top:22px;
    padding:14px;
    background:var(--primary);
    color:#fff;
    border-radius:999px;
    font-weight:600;
    font-size:16px;
    border:none;
    cursor:pointer;
    transition:0.2s ease;
    text-decoration:none;
  }
  .btn-start:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
  }
  .copyright{
    text-align:center;
    margin-top:32px;
    font-size:13px;
    color:var(--text-sub);
  }
  @media(max-width:640px){
    .title-main{
      font-size:24px;
    }
    .card{
      padding:20px 16px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="back-bar">
    <a href="./index.html">← 返回游戏专区大厅</a>
  </div>
  <div class="card">
    <h1 class="title-main">找到我</h1>
    <div class="sub-title">微恐文字解谜网页游戏</div>

    <div class="warn-box">
      <h4>⚠️ 重要前置声明</h4>
      <p>本作品为完全虚构的剧情解谜游戏。
      <br>里面所有人物、事件、论坛、网页、故事设定全部是架空创作，并非真实事件，不存在现实中的抹除机制。
      <br>游戏氛围偏向细思极恐、悬疑压抑，没有突然惊吓镜头、没有血腥画面。
      <br>全程游玩大约30分钟。</p>
    </div>

    <h3 class="sec-h">故事简介</h3>
    <div class="story">
      2015年九月，少年顾星从世界上被慢慢抹除。
      <br><br>
      到了2023年，全世界已经没有任何他存在过的痕迹。
      <br><br>
      只有你，林屿，还记得他。
      <br><br>
      你将前往辛巴论坛开启这段跨越时间的寻忆之旅。
    </div>

    <div class="tip-ready">你准备好了吗？</div>

    <a class="btn-start" target="_blank" href="https://zdw.wangjiantuandui.xyz">【开始游戏】</a>
  </div>
  <div class="copyright">© 2026 忘见团队</div>
</div>
</body>
</html>
