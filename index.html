<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>忘见团队 · 游戏专区</title>
<style>
  :root{
    --primary:#2563eb;
    --primary-soft:#e8f0fe;
    --bg:#f7f9fc;
    --card:#ffffff;
    --text:#1f2937;
    --text-sub:#6b7280;
    --line:#e5e9f0;
    --radius:14px;
    --warn:#dc2626;
    --warn-soft:#fef2f2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
  }
  a{color:inherit;text-decoration:none;}

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:1000px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;
  }
  .brand{font-weight:700;font-size:20px;}
  .brand span{color:var(--primary);}
  .back-home{font-size:14px;color:var(--primary);}
  .back-home:hover{text-decoration:underline;}

  .hero{
    max-width:1000px;margin:0 auto;
    padding:40px 16px 24px;text-align:center;
  }
  .hero h1{font-size:30px;font-weight:800;margin-bottom:8px;}
  .hero p{color:var(--text-sub);}

  .container{
    max-width:1000px;margin:0 auto;
    padding:0 16px 40px;
  }
  .game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
  }
  .game-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    transition:0.24s ease;
  }
  .game-card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 20px rgba(37,99,235,0.12);
  }
  .card-cover{
    height:160px;
    background:var(--primary-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:64px;
  }
  .card-body{padding:20px;}
  .tag-horror{
    display:inline-block;
    background:var(--warn-soft);
    color:var(--warn);
    border:1px solid #fecaca;
    border-radius:999px;
    font-size:12px;
    padding:3px 8px;
    margin-bottom:8px;
  }
  .card-body h3{font-size:18px;margin-bottom:6px;}
  .card-body p{font-size:14px;color:var(--text-sub);}

  footer{
    border-top:1px solid var(--line);
    padding:24px 16px;
    text-align:center;
    font-size:13px;color:var(--text-sub);
  }
  @media(max-width:640px){
    .hero h1{font-size:24px;}
    .card-cover{height:140px;font-size:56px;}
  }
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="brand">忘见<span>游戏专区</span></div>
    <a class="back-home" href="https://www.wangjiantuandui.xyz">← 返回官网</a>
  </div>
</header>

<div class="hero">
  <h1>游戏专区</h1>
  <p>忘见团队自制网页游戏集合</p>
</div>

<div class="container">
  <div class="game-grid" id="gameGrid"></div>
</div>

<footer>
  © 2026 忘见团队
</footer>

<script>
const GAME_LIST = [
  {
    title:"找到我",
    desc:"细思极恐悬疑文字解谜",
    icon:"🎮",
    tag:"微恐",
    page:"./zhaodaowo.html"
  }
];
const grid = document.getElementById("gameGrid");
GAME_LIST.forEach(g=>{
  const div = document.createElement("div");
  div.className = "game-card";
  div.innerHTML = `
    <a href="${g.page}">
      <div class="card-cover">${g.icon}</div>
      <div class="card-body">
        <span class="tag-horror">${g.tag}</span>
        <h3>${g.title}</h3>
        <p>${g.desc}</p>
      </div>
    </a>
  `;
  grid.appendChild(div);
})
</script>
</body>
</html>
